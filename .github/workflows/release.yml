name: Release Oficial Action

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 1. Google Release Please gerencia o PR de release, CHANGELOG.md e tag oficial na main
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          release-type: node
          target-branch: main

      # 2. Etapas executadas EXCLUSIVAMENTE quando o PR de release é mergeado na main
      - name: Checkout do código pós-release
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.x
          cache: 'yarn'

      - name: Instalar dependências
        if: ${{ steps.release.outputs.release_created }}
        run: yarn install --frozen-lockfile

      - name: Compilar bundle de distribuição (dist/)
        if: ${{ steps.release.outputs.release_created }}
        run: |
          yarn run build
          if [ ! -f dist/index.js ]; then
            echo "::error::dist/index.js não foi gerado pelo build!"
            exit 1
          fi
          echo "Bundle compilado com sucesso: $(ls -lh dist/index.js | awk '{print $5}')"

      - name: Atualizar Tag Oficial e Tag Flutuante de Major (vX) com Bundle Compilado
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          MAJOR_VER: ${{ steps.release.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Garante que o dist/index.js compilado esteja presente no commit apontado pelas tags (em detached HEAD, sem tocar na main)
          git checkout --detach HEAD
          git add -f dist/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bundle dist for ${TAG_NAME}"
          fi

          echo "Atualizando tag semântica ${TAG_NAME}..."
          git tag -fa "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "${TAG_NAME}" --force

          # Padrão oficial GitHub Actions: atualiza apenas a tag flutuante da Major correspondente (ex: v1 para 1.x.x, v2 para 2.x.x).
          # Quando houver breaking change para 2.0.0, a v1 permanece congelada na última 1.x.x para não quebrar quem usa @v1!
          echo "Atualizando tag flutuante da Major v${MAJOR_VER}..."
          git tag -fa "v${MAJOR_VER}" -m "Release v${MAJOR_VER} -> ${TAG_NAME}"
          git push origin "v${MAJOR_VER}" --force

      - name: Anexar artefatos à GitHub Release oficial
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            dist/index.js
            dist/licenses.txt
            action.yml
